name: Deploy Mbale Media Daily to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
      - name: Checkout latest Mbale Media Daily source
        uses: actions/checkout@v4
        with:
          repository: musimbigerald8-spec/Mbale-media-daily-
          ref: main
          path: _site
          fetch-depth: 1
      - name: Remove repository metadata
        run: rm -rf _site/.git _site/.github
      - name: Add Business and Africa to homepage navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#national">Uganda</a><a href="#sports">Sports</a>'
          new = '<a href="#national">Uganda</a><a href="business.html">Business</a><a href="africa.html">Africa</a><a href="#sports">Sports</a>'
          if old in s and 'href="business.html">Business</a>' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
