name: Deploy Mbale Media Daily to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Fetch latest Mbale Media Daily site
        run: |
          rm -rf _site
          git clone --depth 1 https://github.com/musimbigerald8-spec/Mbale-media-daily-.git _site
          rm -rf _site/.git _site/.github

      - name: Add Google AdSense verification code
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '''<meta name="google-adsense-account" content="ca-pub-5940733608530998">\n<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5940733608530998" crossorigin="anonymous"></script>'''
          for path in Path('_site').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'ca-pub-5940733608530998' not in text:
                  text = text.replace('</head>', tag + '\n</head>', 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
